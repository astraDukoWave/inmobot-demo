# Prueba mínima contra el modelo REAL (REQ-32). Manual: cuesta tokens.
# Debe existir en main para que GitHub muestre "Run workflow"; se puede correr sobre cualquier rama.
name: live-smoke
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modelo de Gemini"
        required: false
        default: "gemini-3.8-flash"
permissions:
  contents: read
concurrency:
  group: live-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Live smoke against the real model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
          GEMINI_MODEL: ${{ inputs.model }}
        run: python scripts/live_smoke.py --report smoke-report.md
      - name: Publish report
        if: always()
        run: |
          if [ ! -f smoke-report.md ]; then echo "::error title=live-smoke::no se generó reporte"; exit 0; fi
          cat smoke-report.md >> "$GITHUB_STEP_SUMMARY"
          # También como anotaciones: se leen por la API de check-runs sin descargar logs.
          python - <<'PY'
          from pathlib import Path
          body = Path("smoke-report.md").read_text(encoding="utf-8")
          chunks = [body[i:i + 2000] for i in range(0, len(body), 2000)][:10]
          for n, chunk in enumerate(chunks, 1):
              esc = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=live-smoke {n}/{len(chunks)}::{esc}")
          PY

[project]
name = "inmobot"
version = "2.0.0"
description = "Agente inmobiliario Sofía con tool use (demo con catálogo ficticio)"
requires-python = ">=3.10"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
